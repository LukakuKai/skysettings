name: Build mod

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.8.2
      - name: Build
        run: gradle build --no-daemon
      - name: Jar pruefen
        run: unzip -l build/libs/skysettings-1.0.0.jar | grep -E "fabric.mod.json|SkySettingsClient|META-INF/jars"
      - uses: actions/upload-artifact@v4
        with:
          name: skysettings
          path: build/libs/skysettings-1.0.0.jar
      - name: Release mit JAR veroeffentlichen
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest build/libs/skysettings-1.0.0.jar \
            --title "SkySettings (neuester Build)" \
            --notes "Automatisch gebaut fuer Minecraft 1.21.11 (Fabric). JAR in den mods-Ordner legen."
          gh release edit latest --draft=false --latest || true
