name: Build mod

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2
      - run: gradle build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: skycontrol-mod
          path: build/libs/*.jar
      - name: Release mit JAR veroeffentlichen
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest build/libs/skycontrol-1.0.0.jar \
            --title "SkyControl (neuester Build)" \
            --notes "Automatisch gebaut. Die JAR kommt in den mods-Ordner (Fabric 1.21.1 + Fabric API)."
