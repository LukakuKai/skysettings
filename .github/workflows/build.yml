name: Build mod

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.8.2
      - name: Build
        run: gradle build --no-daemon
      - name: Inspect Minecraft API
        continue-on-error: true
        run: |
          for j in $(find ~/.gradle /home/runner/work -name '*.jar' 2>/dev/null); do
            if unzip -l "$j" 2>/dev/null | grep -q 'net/minecraft/world/attribute/EnvironmentAttributes.class'; then
              echo "=== JAR: $j"
              javap -p -cp "$j" net.minecraft.world.attribute.EnvironmentAttributes | grep -iE "VISUAL|ANGLE|SKY|STAR|MOON|SUN|TIME|FOG|CLOUD" 
              javap -p -cp "$j" net.minecraft.world.attribute.WorldEnvironmentAttributeAccess
              for c in $(unzip -l "$j" | grep -oE 'net/minecraft/[a-z/]*(Clock|Timeline|WorldTime|TimeOfDay)[A-Za-z$]*\.class' | sed 's/\.class//;s#/#.#g' | sort -u | head -40); do
                echo "--- $c"; javap -p -cp "$j" "$c" | head -40
              done
              break
            fi
          done
      - name: Jar pruefen
        run: unzip -l build/libs/skysettings-1.0.0.jar | grep -E "fabric.mod.json|SkySettingsClient"
      - uses: actions/upload-artifact@v4
        with:
          name: skysettings
          path: build/libs/skysettings-1.0.0.jar
      - name: Release mit JAR veroeffentlichen
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest build/libs/skysettings-1.0.0.jar \
            --title "SkySettings (neuester Build)" \
            --notes "Automatisch gebaut fuer Minecraft 1.21.11 (Fabric). JAR in den mods-Ordner legen."
