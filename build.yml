name: build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.8.2
      - name: Projektdateien erzeugen
        run: |
          mkdir -p src/main/java/dev/skysettings src/main/java/dev/skysettings/mixin src/main/resources
          cat > build.gradle <<'EOF_FILE'
          plugins {
          	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
          	id 'maven-publish'
          }

          version = project.mod_version
          group = project.maven_group

          base {
          	archivesName = project.archives_base_name
          }

          repositories {
          }

          dependencies {
          	minecraft "com.mojang:minecraft:${project.minecraft_version}"
          	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
          	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
          	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
          }

          processResources {
          	inputs.property "version", project.version

          	filesMatching("fabric.mod.json") {
          		expand "version": project.version
          	}
          }

          tasks.withType(JavaCompile).configureEach {
          	it.options.release = 21
          }

          java {
          	withSourcesJar()
          	sourceCompatibility = JavaVersion.VERSION_21
          	targetCompatibility = JavaVersion.VERSION_21
          }
          EOF_FILE
          cat > gradle.properties <<'EOF_FILE'
          org.gradle.jvmargs=-Xmx2G
          org.gradle.parallel=true

          # Fabric Properties (Minecraft 1.21.11)
          minecraft_version=1.21.11
          yarn_mappings=1.21.11+build.6
          loader_version=0.20.1
          loom_version=1.19.4

          # Mod Properties
          mod_version=1.0.0
          maven_group=dev.skysettings
          archives_base_name=skysettings

          # Fabric API
          fabric_version=0.141.6+1.21.11
          EOF_FILE
          cat > settings.gradle <<'EOF_FILE'
          pluginManagement {
          	repositories {
          		maven {
          			name = 'Fabric'
          			url = 'https://maven.fabricmc.net/'
          		}
          		mavenCentral()
          		gradlePluginPortal()
          	}
          }
          EOF_FILE
          cat > src/main/resources/fabric.mod.json <<'EOF_FILE'
          {
            "schemaVersion": 1,
            "id": "skysettings",
            "version": "${version}",
            "name": "Sky Settings",
            "description": "Öffne mit /skysettings ein Menü, um Himmelshelligkeit, Wolken und Nebel einzustellen.",
            "authors": ["Du"],
            "license": "MIT",
            "environment": "client",
            "entrypoints": {
              "client": ["dev.skysettings.SkySettingsClient"]
            },
            "mixins": [
              {
                "config": "skysettings.mixins.json",
                "environment": "client"
              }
            ],
            "depends": {
              "fabricloader": ">=0.18.0",
              "minecraft": "1.21.11",
              "java": ">=21",
              "fabric-api": "*"
            }
          }
          EOF_FILE
          cat > src/main/resources/skysettings.mixins.json <<'EOF_FILE'
          {
            "required": true,
            "package": "dev.skysettings.mixin",
            "compatibilityLevel": "JAVA_21",
            "client": [
              "WorldEnvironmentAttributeAccessMixin"
            ],
            "injectors": {
              "defaultRequire": 1
            }
          }
          EOF_FILE
          cat > src/main/java/dev/skysettings/SkyConfig.java <<'EOF_FILE'
          package dev.skysettings;

          import com.google.gson.Gson;
          import com.google.gson.GsonBuilder;
          import net.fabricmc.loader.api.FabricLoader;

          import java.io.IOException;
          import java.io.Reader;
          import java.io.Writer;
          import java.nio.file.Files;
          import java.nio.file.Path;

          /** Speichert alle Einstellungen in config/skysettings.json. */
          public final class SkyConfig {
          	private static final Gson GSON = new GsonBuilder().setPrettyPrinting().create();
          	private static SkyConfig instance = new SkyConfig();

          	public boolean enabled = true;
          	/** 0.0 - 2.0 (1.0 = Vanilla) */
          	public float skyBrightness = 1.0f;
          	/** 0.0 - 1.0 (1.0 = Vanilla) */
          	public float starBrightness = 1.0f;
          	/** 0.0 - 1.0 (1.0 = Vanilla) */
          	public float cloudOpacity = 1.0f;
          	/** 0.0 - 2.0 (1.0 = Vanilla) */
          	public float cloudBrightness = 1.0f;
          	/** -64 - 128 Blöcke (0 = Vanilla) */
          	public float cloudHeightOffset = 0.0f;
          	/** 0.0 - 3.0 (1.0 = Vanilla, 0 = kein Nebel) */
          	public float fogDensity = 1.0f;

          	public static SkyConfig get() {
          		return instance;
          	}

          	private static Path file() {
          		return FabricLoader.getInstance().getConfigDir().resolve("skysettings.json");
          	}

          	public static void load() {
          		Path file = file();
          		if (!Files.exists(file)) {
          			return;
          		}
          		try (Reader reader = Files.newBufferedReader(file)) {
          			SkyConfig loaded = GSON.fromJson(reader, SkyConfig.class);
          			if (loaded != null) {
          				loaded.clamp();
          				instance = loaded;
          			}
          		} catch (Exception e) {
          			SkySettingsClient.LOGGER.warn("Konnte skysettings.json nicht lesen, nutze Standardwerte", e);
          		}
          	}

          	public static void save() {
          		try (Writer writer = Files.newBufferedWriter(file())) {
          			GSON.toJson(instance, writer);
          		} catch (IOException e) {
          			SkySettingsClient.LOGGER.warn("Konnte skysettings.json nicht speichern", e);
          		}
          	}

          	public void reset() {
          		SkyConfig d = new SkyConfig();
          		enabled = d.enabled;
          		skyBrightness = d.skyBrightness;
          		starBrightness = d.starBrightness;
          		cloudOpacity = d.cloudOpacity;
          		cloudBrightness = d.cloudBrightness;
          		cloudHeightOffset = d.cloudHeightOffset;
          		fogDensity = d.fogDensity;
          	}

          	private void clamp() {
          		skyBrightness = Math.max(0f, Math.min(2f, skyBrightness));
          		starBrightness = Math.max(0f, Math.min(1f, starBrightness));
          		cloudOpacity = Math.max(0f, Math.min(1f, cloudOpacity));
          		cloudBrightness = Math.max(0f, Math.min(2f, cloudBrightness));
          		cloudHeightOffset = Math.max(-64f, Math.min(128f, cloudHeightOffset));
          		fogDensity = Math.max(0f, Math.min(3f, fogDensity));
          	}
          }
          EOF_FILE
          cat > src/main/java/dev/skysettings/SkyEffects.java <<'EOF_FILE'
          package dev.skysettings;

          import net.minecraft.world.attribute.EnvironmentAttribute;
          import net.minecraft.world.attribute.EnvironmentAttributes;

          /**
           * Verändert die visuellen Environment-Attribute (Himmel, Wolken, Nebel),
           * die der Renderer in Minecraft 1.21.11 abfragt.
           */
          public final class SkyEffects {
          	private static final ThreadLocal<int[]> DEPTH = ThreadLocal.withInitial(() -> new int[1]);

          	private SkyEffects() {
          	}

          	/** Beim Betreten von getAttributeValue aufrufen. */
          	public static void enter() {
          		DEPTH.get()[0]++;
          	}

          	/** Beim Verlassen aufrufen. Gibt true zurück, wenn es der äußerste Aufruf war. */
          	public static boolean exit() {
          		int[] depth = DEPTH.get();
          		depth[0] = Math.max(0, depth[0] - 1);
          		return depth[0] == 0;
          	}

          	public static Object apply(EnvironmentAttribute<?> attribute, Object value) {
          		SkyConfig c = SkyConfig.get();
          		if (!c.enabled || value == null) {
          			return value;
          		}

          		if (attribute == EnvironmentAttributes.SKY_COLOR_VISUAL || attribute == EnvironmentAttributes.FOG_COLOR_VISUAL) {
          			if (value instanceof Integer color) {
          				return scaleRgb(color, c.skyBrightness);
          			}
          		} else if (attribute == EnvironmentAttributes.STAR_BRIGHTNESS_VISUAL) {
          			if (value instanceof Float f) {
          				return clamp01(f * c.starBrightness);
          			}
          		} else if (attribute == EnvironmentAttributes.CLOUD_COLOR_VISUAL) {
          			if (value instanceof Integer color) {
          				return scaleAlpha(scaleRgb(color, c.cloudBrightness), c.cloudOpacity);
          			}
          		} else if (attribute == EnvironmentAttributes.CLOUD_HEIGHT_VISUAL) {
          			if (value instanceof Float f) {
          				return f + c.cloudHeightOffset;
          			}
          		} else if (attribute == EnvironmentAttributes.FOG_START_DISTANCE_VISUAL
          				|| attribute == EnvironmentAttributes.FOG_END_DISTANCE_VISUAL
          				|| attribute == EnvironmentAttributes.SKY_FOG_END_DISTANCE_VISUAL
          				|| attribute == EnvironmentAttributes.CLOUD_FOG_END_DISTANCE_VISUAL) {
          			if (value instanceof Float f) {
          				// Mehr Dichte = Nebel beginnt/endet näher. 0 = Nebel (fast) aus.
          				float factor = c.fogDensity <= 0.01f ? 100f : 1f / c.fogDensity;
          				return f * factor;
          			}
          		}
          		return value;
          	}

          	private static float clamp01(float v) {
          		return Math.max(0f, Math.min(1f, v));
          	}

          	private static int scaleRgb(int argb, float factor) {
          		int a = argb & 0xFF000000;
          		int r = clampByte(Math.round(((argb >> 16) & 0xFF) * factor));
          		int g = clampByte(Math.round(((argb >> 8) & 0xFF) * factor));
          		int b = clampByte(Math.round((argb & 0xFF) * factor));
          		return a | (r << 16) | (g << 8) | b;
          	}

          	private static int scaleAlpha(int argb, float factor) {
          		int a = clampByte(Math.round(((argb >>> 24) & 0xFF) * factor));
          		return (a << 24) | (argb & 0x00FFFFFF);
          	}

          	private static int clampByte(int v) {
          		return Math.max(0, Math.min(255, v));
          	}
          }
          EOF_FILE
          cat > src/main/java/dev/skysettings/SkySettingsClient.java <<'EOF_FILE'
          package dev.skysettings;

          import net.fabricmc.api.ClientModInitializer;
          import net.fabricmc.fabric.api.client.command.v2.ClientCommandManager;
          import net.fabricmc.fabric.api.client.command.v2.ClientCommandRegistrationCallback;
          import net.fabricmc.fabric.api.client.event.lifecycle.v1.ClientTickEvents;
          import org.slf4j.Logger;
          import org.slf4j.LoggerFactory;

          public class SkySettingsClient implements ClientModInitializer {
          	public static final Logger LOGGER = LoggerFactory.getLogger("skysettings");

          	private static boolean openRequested = false;

          	@Override
          	public void onInitializeClient() {
          		SkyConfig.load();

          		ClientCommandRegistrationCallback.EVENT.register((dispatcher, registryAccess) ->
          				dispatcher.register(ClientCommandManager.literal("skysettings").executes(context -> {
          					// Der Chat schließt sich nach dem Befehl selbst, daher das Menü erst im nächsten Tick öffnen.
          					openRequested = true;
          					return 1;
          				})));

          		ClientTickEvents.END_CLIENT_TICK.register(client -> {
          			if (openRequested) {
          				openRequested = false;
          				client.setScreen(new SkySettingsScreen(client.currentScreen));
          			}
          		});
          	}
          }
          EOF_FILE
          cat > src/main/java/dev/skysettings/SkySettingsScreen.java <<'EOF_FILE'
          package dev.skysettings;

          import net.minecraft.client.gui.DrawContext;
          import net.minecraft.client.gui.screen.Screen;
          import net.minecraft.client.gui.widget.ButtonWidget;
          import net.minecraft.client.gui.widget.SliderWidget;
          import net.minecraft.screen.ScreenTexts;
          import net.minecraft.text.Text;

          import java.util.function.Consumer;
          import java.util.function.Function;

          public class SkySettingsScreen extends Screen {
          	private static final int WIDTH = 220;
          	private static final int HEIGHT = 20;
          	private static final int GAP = 24;

          	private final Screen parent;

          	public SkySettingsScreen(Screen parent) {
          		super(Text.literal("Sky Settings"));
          		this.parent = parent;
          	}

          	@Override
          	protected void init() {
          		SkyConfig c = SkyConfig.get();
          		// Links ausgerichtet, damit der Himmel in der Mitte sichtbar bleibt.
          		int x = 20;
          		int y = Math.max(30, height / 2 - 100);

          		addDrawableChild(ButtonWidget.builder(toggleText(c), button -> {
          			c.enabled = !c.enabled;
          			button.setMessage(toggleText(c));
          		}).dimensions(x, y, WIDTH, HEIGHT).build());
          		y += GAP;

          		addDrawableChild(new ConfigSlider(x, y, "Himmelshelligkeit", 0f, 2f, c.skyBrightness,
          				v -> c.skyBrightness = v, SkySettingsScreen::percent));
          		y += GAP;
          		addDrawableChild(new ConfigSlider(x, y, "Sternhelligkeit", 0f, 1f, c.starBrightness,
          				v -> c.starBrightness = v, SkySettingsScreen::percent));
          		y += GAP;
          		addDrawableChild(new ConfigSlider(x, y, "Wolken-Dichte (Deckkraft)", 0f, 1f, c.cloudOpacity,
          				v -> c.cloudOpacity = v, SkySettingsScreen::percent));
          		y += GAP;
          		addDrawableChild(new ConfigSlider(x, y, "Wolkenhelligkeit", 0f, 2f, c.cloudBrightness,
          				v -> c.cloudBrightness = v, SkySettingsScreen::percent));
          		y += GAP;
          		addDrawableChild(new ConfigSlider(x, y, "Wolkenhöhe", -64f, 128f, c.cloudHeightOffset,
          				v -> c.cloudHeightOffset = v, SkySettingsScreen::blocks));
          		y += GAP;
          		addDrawableChild(new ConfigSlider(x, y, "Nebeldichte", 0f, 3f, c.fogDensity,
          				v -> c.fogDensity = v, SkySettingsScreen::percent));
          		y += GAP + 6;

          		int half = (WIDTH - 4) / 2;
          		addDrawableChild(ButtonWidget.builder(Text.literal("Zurücksetzen"), button -> {
          			c.reset();
          			clearAndInit();
          		}).dimensions(x, y, half, HEIGHT).build());
          		addDrawableChild(ButtonWidget.builder(ScreenTexts.DONE, button -> close())
          				.dimensions(x + half + 4, y, half, HEIGHT).build());
          	}

          	private static Text toggleText(SkyConfig c) {
          		return Text.literal("Sky Settings: " + (c.enabled ? "AN" : "AUS"));
          	}

          	private static String percent(float v) {
          		return Math.round(v * 100f) + "%";
          	}

          	private static String blocks(float v) {
          		int r = Math.round(v);
          		return (r > 0 ? "+" : "") + r + " Blöcke";
          	}

          	@Override
          	public void renderBackground(DrawContext context, int mouseX, int mouseY, float deltaTicks) {
          		// Bewusst leer: kein Weichzeichner, damit man den Himmel live beurteilen kann.
          	}

          	@Override
          	public void render(DrawContext context, int mouseX, int mouseY, float deltaTicks) {
          		super.render(context, mouseX, mouseY, deltaTicks);
          		context.drawCenteredTextWithShadow(textRenderer, title, 20 + WIDTH / 2, Math.max(30, height / 2 - 100) - 16,
          				0xFFFFFFFF);
          	}

          	@Override
          	public void removed() {
          		SkyConfig.save();
          	}

          	@Override
          	public void close() {
          		client.setScreen(parent);
          	}

          	private static final class ConfigSlider extends SliderWidget {
          		private final String label;
          		private final float min;
          		private final float max;
          		private final Consumer<Float> setter;
          		private final Function<Float, String> formatter;

          		ConfigSlider(int x, int y, String label, float min, float max, float initial,
          				Consumer<Float> setter, Function<Float, String> formatter) {
          			super(x, y, WIDTH, HEIGHT, Text.empty(), (double) ((initial - min) / (max - min)));
          			this.label = label;
          			this.min = min;
          			this.max = max;
          			this.setter = setter;
          			this.formatter = formatter;
          			updateMessage();
          		}

          		private float current() {
          			return (float) (min + (max - min) * value);
          		}

          		@Override
          		protected void updateMessage() {
          			setMessage(Text.literal(label + ": " + formatter.apply(current())));
          		}

          		@Override
          		protected void applyValue() {
          			setter.accept(current());
          		}
          	}
          }
          EOF_FILE
          cat > src/main/java/dev/skysettings/mixin/WorldEnvironmentAttributeAccessMixin.java <<'EOF_FILE'
          package dev.skysettings.mixin;

          import dev.skysettings.SkyEffects;
          import net.minecraft.util.math.Vec3d;
          import net.minecraft.world.attribute.EnvironmentAttribute;
          import net.minecraft.world.attribute.WeightedAttributeList;
          import net.minecraft.world.attribute.WorldEnvironmentAttributeAccess;
          import org.spongepowered.asm.mixin.Mixin;
          import org.spongepowered.asm.mixin.injection.At;
          import org.spongepowered.asm.mixin.injection.Inject;
          import org.spongepowered.asm.mixin.injection.callback.CallbackInfoReturnable;

          @Mixin(WorldEnvironmentAttributeAccess.class)
          public class WorldEnvironmentAttributeAccessMixin {
          	private static final String ONE_ARG =
          			"getAttributeValue(Lnet/minecraft/world/attribute/EnvironmentAttribute;)Ljava/lang/Object;";
          	private static final String THREE_ARGS =
          			"getAttributeValue(Lnet/minecraft/world/attribute/EnvironmentAttribute;"
          					+ "Lnet/minecraft/util/math/Vec3d;"
          					+ "Lnet/minecraft/world/attribute/WeightedAttributeList;)Ljava/lang/Object;";

          	// Beide Überladungen werden abgefangen. Ein Tiefenzähler sorgt dafür, dass der Wert
          	// nur einmal verändert wird, falls eine Überladung die andere aufruft.

          	@Inject(method = ONE_ARG, at = @At("HEAD"))
          	private void skysettings$enterOne(EnvironmentAttribute<?> attribute, CallbackInfoReturnable<Object> cir) {
          		SkyEffects.enter();
          	}

          	@Inject(method = ONE_ARG, at = @At("RETURN"), cancellable = true)
          	private void skysettings$exitOne(EnvironmentAttribute<?> attribute, CallbackInfoReturnable<Object> cir) {
          		if (SkyEffects.exit()) {
          			cir.setReturnValue(SkyEffects.apply(attribute, cir.getReturnValue()));
          		}
          	}

          	@Inject(method = THREE_ARGS, at = @At("HEAD"))
          	private void skysettings$enterThree(EnvironmentAttribute<?> attribute, Vec3d pos, WeightedAttributeList pool,
          			CallbackInfoReturnable<Object> cir) {
          		SkyEffects.enter();
          	}

          	@Inject(method = THREE_ARGS, at = @At("RETURN"), cancellable = true)
          	private void skysettings$exitThree(EnvironmentAttribute<?> attribute, Vec3d pos, WeightedAttributeList pool,
          			CallbackInfoReturnable<Object> cir) {
          		if (SkyEffects.exit()) {
          			cir.setReturnValue(SkyEffects.apply(attribute, cir.getReturnValue()));
          		}
          	}
          }
          EOF_FILE
      - name: Build
        run: gradle build
      - name: Jar pruefen
        run: |
          J=build/libs/skysettings-1.0.0.jar
          unzip -l "$J"
          unzip -l "$J" | grep -q 'fabric.mod.json'
          unzip -l "$J" | grep -q 'dev/skysettings/SkySettingsClient.class'
          unzip -l "$J" | grep -q 'dev/skysettings/SkySettingsScreen.class'
      - uses: actions/upload-artifact@v4
        with:
          name: skysettings
          path: build/libs/skysettings-1.0.0.jar
